name: Validate Elo tournament tools

on:
  push:
    branches: [tools/elo-tournament]
    paths:
      - 'tournament/**'
      - '.github/workflows/tournament-tools.yml'
  pull_request:
    paths:
      - 'tournament/**'
      - '.github/workflows/tournament-tools.yml'
      - 'CMakeLists.txt'
      - 'bit_utils.h'
      - 'magics.cpp'
      - 'time_manager.h'
      - '*.cpp'
      - '*.h'

jobs:
  estimator:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-python@v6
        with:
          python-version: '3.12'
      - name: Compile estimator
        run: python -m py_compile tournament/estimate_elo.py
      - name: Smoke-test Elo fit
        run: |
          cat > /tmp/synthetic.pgn <<'PGN'
          [Event "Synthetic"]
          [White "Pickle_D11"]
          [Black "Stockfish_2400"]
          [Result "1-0"]

          [Event "Synthetic"]
          [White "Stockfish_2400"]
          [Black "Pickle_D11"]
          [Result "0-1"]

          [Event "Synthetic"]
          [White "Pickle_D11"]
          [Black "Stockfish_2400"]
          [Result "0-1"]

          [Event "Synthetic"]
          [White "Stockfish_2400"]
          [Black "Pickle_D11"]
          [Result "1-0"]

          [Event "Synthetic"]
          [White "Pickle_D11"]
          [Black "Stockfish_2400"]
          [Result "1/2-1/2"]

          [Event "Synthetic"]
          [White "Stockfish_2400"]
          [Black "Pickle_D11"]
          [Result "1/2-1/2"]

          [Event "Synthetic"]
          [White "Pickle_D11"]
          [Black "Stockfish_2400"]
          [Result "1/2-1/2"]

          [Event "Synthetic"]
          [White "Stockfish_2400"]
          [Black "Pickle_D11"]
          [Result "1/2-1/2"]
          PGN
          python tournament/estimate_elo.py /tmp/synthetic.pgn --bootstrap 300 | tee /tmp/elo.txt
          grep -q 'Estimated Pickle D11 Elo: 2400' /tmp/elo.txt

  powershell-syntax:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v5
      - name: Parse PowerShell launchers
        shell: pwsh
        run: |
          Get-ChildItem tournament -Filter *.ps1 | ForEach-Object {
            Write-Host "Parsing $($_.Name)"
            [void][ScriptBlock]::Create((Get-Content $_.FullName -Raw))
          }
      - name: Verify current Stockfish Windows x86-64 asset is discoverable
        shell: pwsh
        env:
          GITHUB_TOKEN: ${{ github.token }}
        run: |
          $headers = @{
            'User-Agent' = 'Pickle-Elo-Harness-CI'
            'Authorization' = "Bearer $env:GITHUB_TOKEN"
          }
          $release = Invoke-RestMethod -Uri 'https://api.github.com/repos/official-stockfish/Stockfish/releases/latest' -Headers $headers
          $asset = @($release.assets) | Where-Object {
            $_.name -match '(?i)^stockfish-windows-(x86[-_]?64|x64).*\.zip$' -and
            $_.name -notmatch '(?i)arm64'
          } | Select-Object -First 1
          if (-not $asset) {
            throw "No compatible Windows x86-64 Stockfish ZIP found in $($release.tag_name)."
          }
          Write-Host "Resolved $($release.tag_name): $($asset.name)"

  windows-native-build:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v5
      - name: Configure Release build
        run: cmake -S . -B build-windows
      - name: Build Pickle with MSVC
        run: cmake --build build-windows --config Release --parallel
      - name: Smoke-test UCI
        shell: pwsh
        run: |
          $inputText = "uci`nisready`nquit`n"
          $output = $inputText | & .\build-windows\Release\pickle.exe
          $output | Write-Host
          if ($output -notcontains 'uciok') { throw 'Missing uciok from Windows build.' }
          if ($output -notcontains 'readyok') { throw 'Missing readyok from Windows build.' }
      - name: Run FastChess UCI compliance
        shell: pwsh
        env:
          GITHUB_TOKEN: ${{ github.token }}
        run: |
          $headers = @{
            'User-Agent' = 'Pickle-Elo-Harness-CI'
            'Authorization' = "Bearer $env:GITHUB_TOKEN"
          }
          $release = Invoke-RestMethod -Uri 'https://api.github.com/repos/Disservin/fastchess/releases/latest' -Headers $headers
          $asset = @($release.assets) | Where-Object {
            $_.name -match '(?i)windows' -and
            $_.name -match '(?i)(x86[-_]?64|x64)' -and
            $_.name -match '\.zip$'
          } | Select-Object -First 1
          if (-not $asset) { throw "No Windows x86-64 FastChess ZIP found in $($release.tag_name)." }
          Invoke-WebRequest -Uri $asset.browser_download_url -OutFile fastchess.zip
          Expand-Archive -Path fastchess.zip -DestinationPath fastchess-ci -Force
          $fast = Get-ChildItem fastchess-ci -Recurse -File | Where-Object { $_.Name -match '(?i)^fastchess.*\.exe$' } | Select-Object -First 1
          if (-not $fast) { throw 'FastChess executable not found after extraction.' }
          & $fast.FullName --compliance .\build-windows\Release\pickle.exe
          if ($LASTEXITCODE -ne 0) { throw "FastChess compliance failed with exit code $LASTEXITCODE." }
